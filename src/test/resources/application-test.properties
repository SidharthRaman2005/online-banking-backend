# In-memory database so the test suite runs without a PostgreSQL instance.
spring.datasource.url=jdbc:h2:mem:banking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-key-that-is-definitely-long-enough-for-hs256-signing
app.jwt.expiration-ms=86400000

app.account.initial-balance.min=100000
app.account.initial-balance.max=9900000
app.upi.domain=obs
app.timezone=Asia/Kolkata

app.admin.username=admin
app.admin.email=admin@obs.com
app.admin.password=Admin@123

app.cors.allowed-origins=http://localhost:5173
