spring.application.name=online-banking-system
server.port=8080

# ---------- Database ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/online_banking
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Forces queries to be resolved inside the service layer instead of during serialization.
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Override with the JWT_SECRET env var. Must be at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:dev-only-secret-please-replace-with-a-64-character-random-string!!}
app.jwt.expiration-ms=86400000

# ---------- Account generation ----------
app.account.initial-balance.min=100000
app.account.initial-balance.max=9900000
app.upi.domain=obs
# Zone used for "current month" dashboard totals and date filters.
app.timezone=Asia/Kolkata

# ---------- Seeded administrator ----------
# Created once on first startup. Override ADMIN_PASSWORD before any demo.
app.admin.username=admin
app.admin.email=${ADMIN_EMAIL:admin@obs.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------- Docs ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- Errors ----------
server.error.include-stacktrace=never
server.error.include-message=never
