# In-memory database for local testing without PostgreSQL
spring.datasource.url=jdbc:h2:mem:banking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Enable H2 console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

app.jwt.secret=${JWT_SECRET:dev-only-secret-please-replace-with-a-64-character-random-string!!}
app.jwt.expiration-ms=86400000

app.account.min-initial-deposit=500.00
app.upi.domain=obs
app.timezone=Asia/Kolkata

app.admin.username=admin
app.admin.email=${ADMIN_EMAIL:admin@obs.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:3000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

